<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>審判用カウンターアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 赤コーナー -->
        <div class="corner red-corner">
            <input type="text" id="red-player" class="player-input red-input" placeholder="赤コーナー">
            <div class="counter-display" id="red-counter">0</div>
            <div class="button-group">
                <button class="control-button red-button" onclick="increment('red')">＋</button>
                <button class="control-button red-button" onclick="decrement('red')">－</button>
            </div>
            <div class="yellow-card-section">
                <div class="button-group">
                    <button class="yellow-card-button" onclick="addYellowCard('red')">＋</button>
                    <div class="yellow-card-display" id="red-yellow-card"></div>
                    <button class="yellow-card-button" onclick="removeYellowCard('red')">－</button>
                </div>
            </div>
        </div>

        <!-- タイマーセクション -->
        <div class="timer-section">
            <input type="text" id="timer-input" class="timer-input" value="03:00">
            <div class="timer-controls">
                <button class="timer-button start-button" onclick="startTimer()">START</button>
                <button class="timer-button stop-button" onclick="stopTimer()">STOP</button>
            </div>
        </div>

        <!-- 青コーナー -->
        <div class="corner blue-corner">
            <input type="text" id="blue-player" class="player-input blue-input" placeholder="青コーナー">
            <div class="counter-display" id="blue-counter">0</div>
            <div class="button-group">
                <button class="control-button blue-button" onclick="increment('blue')">＋</button>
                <button class="control-button blue-button" onclick="decrement('blue')">－</button>
            </div>
            <div class="yellow-card-section">
                <div class="button-group">
                    <button class="yellow-card-button" onclick="addYellowCard('blue')">＋</button>
                    <div class="yellow-card-display" id="blue-yellow-card"></div>
                    <button class="yellow-card-button" onclick="removeYellowCard('blue')">－</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2分間タイマーセクション -->
    <div class="two-minute-timer-section">
        <div id="two-minute-timer" class="timer-input">02:00</div>
        <div class="timer-controls">
            <button class="timer-button start-button" onclick="startTwoMinuteTimer()">start</button>
            <button class="timer-button stop-button" onclick="stopTwoMinuteTimer()">stop</button>
        </div>
    </div>

    <!-- リセットボタン -->
    <div class="reset-section">
        <button class="reset-button" onclick="resetApp()">リセット</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
